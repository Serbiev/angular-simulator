<div class="users-page">
  <h1 class="user-title">Список Пользователей</h1>
  <app-user-create (createUser)="onCreateUser($event)" />
  <app-users-filter (searchChange)="onSearchChange($event)" />
  @if (filteredUsers$ | async; as users) {
    <div class="user-list">
      @for (user of users; track user.id) {
        <app-user-card [user]="user" (deleteUser)="onDeleteUser($event)" />
      } @empty {
        <div class="users-empty">
          <h2 class="users-empty__title">Нет пользователей для отображения</h2>
        </div>
      }
    </div>
  }
</div>
